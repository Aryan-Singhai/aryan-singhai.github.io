name: Portfolio polish

on:
  push:
    paths:
      - '.github/workflows/portfolio-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply content and typography updates
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')

          s = s.replace('<link rel="icon" type="image/png" href="assets/images/favicon.png"><title>', '<link rel="icon" type="image/png" href="assets/images/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>')
          s = s.replace('Engineering professional transitioning into Business &amp; Data Analytics, with hands-on experience in Excel, SQL and Power BI. I build practical analytics projects to uncover trends, measure performance and support data-driven decision making.', 'Mechanical Engineering professional with hands-on experience in Excel, SQL and Power BI, building analytics projects across sales, e-commerce and risk analytics.')
          s = s.replace('I am an engineering professional with a background in Mechanical Engineering, currently working in New Product Development. My experience has developed my ability to work with structured problems, cross-functional teams and process-oriented challenges.</p><p>Alongside my professional experience, I have been building practical expertise in Business and Data Analytics, with a focus on Excel, SQL and Power BI.</p><p>I enjoy working with data to identify patterns, evaluate performance and translate analysis into insights that can support better business decisions. My portfolio showcases hands-on projects demonstrating this approach.', 'I am a Mechanical Engineering professional working in New Product Development, with experience solving structured problems, collaborating across functions and improving processes.</p><p>Alongside my engineering experience, I have developed hands-on expertise in Business and Data Analytics using Excel, SQL and Power BI. My work focuses on turning data into clear performance measures, actionable insights and decision support.</p><p>I enjoy analyzing business performance, identifying trends and translating complex information into practical recommendations. My portfolio showcases projects across sales, e-commerce and risk analytics.')
          s = s.replace('<div class="skill-card"><h3>Analytics</h3><div class="skill-list"><span>Microsoft Excel</span><span>SQL</span><span>Power BI</span><span>Data Analysis</span><span>Data Cleaning</span><span>Data Visualization</span></div></div><div class="skill-card"><h3>Business</h3><div class="skill-list"><span>KPI Analysis</span><span>Performance Reporting</span><span>Trend Analysis</span><span>Business Insights</span><span>Problem Solving</span><span>Process Improvement</span></div></div><div class="skill-card"><h3>Tools</h3><div class="skill-list"><span>Microsoft Office</span><span>Git &amp; GitHub</span><span>Power BI</span><span>Excel</span></div></div>', '<div class="skill-card"><h3>Data &amp; BI</h3><div class="skill-list"><span>Data Analysis</span><span>SQL</span><span>Power BI</span><span>DAX</span><span>Power Query</span><span>Excel</span></div></div><div class="skill-card"><h3>Business Analytics</h3><div class="skill-list"><span>Business Analysis</span><span>KPI Tracking</span><span>Performance Reporting</span><span>Trend Analysis</span><span>Business Insights</span><span>Risk Analysis</span></div></div><div class="skill-card"><h3>Reporting &amp; Tools</h3><div class="skill-list"><span>Dashboarding</span><span>Data Visualization</span><span>Data Cleaning</span><span>Microsoft Office</span><span>Git &amp; GitHub</span></div></div>')
          s = s.replace('Current role · promoted from GET', 'Current role · promoted directly from GET')
          s = s.replace('<section id="contact" class="section contact-section">', '<section id="certifications" class="section section-alt"><div class="container"><div class="section-heading"><p class="section-label">CERTIFICATION</p><h2>Credentials</h2></div><div class="education-card"><p class="education-degree">HackerRank</p><h3>SQL (5-Star)</h3><p>Demonstrated proficiency in SQL problem solving and query-based data analysis.</p></div></div></section><section id="contact" class="section contact-section">')
          index.write_text(s, encoding='utf-8')

          css = Path('style.css')
          c = css.read_text(encoding='utf-8')
          c = c.replace('font-weight: 750;', 'font-weight: 700;')
          c = c.replace('font-weight: 740;', 'font-weight: 700;')
          c = c.replace('font-weight: 760;', 'font-weight: 700;')
          c = c.replace('font-weight: 650;', 'font-weight: 600;')
          c = c.replace('font-weight: 550;', 'font-weight: 500;')
          c = c.replace('line-height: 1.1; letter-spacing: -.04em; font-weight: 700;', 'line-height: 1.12; letter-spacing: -.025em; font-weight: 700;', 1)
          c = c.replace('line-height: 1.03; letter-spacing: -.055em; font-weight: 700;', 'line-height: 1.08; letter-spacing: -.035em; font-weight: 700;')
          c = c.replace('line-height: 1.04; letter-spacing: -.055em;', 'line-height: 1.08; letter-spacing: -.035em;')
          c = c.replace('line-height: 1.05; letter-spacing: -.045em;', 'line-height: 1.08; letter-spacing: -.03em;')
          css.write_text(c, encoding='utf-8')
          PY

      - name: Commit polished files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/portfolio-polish.yml
          git add index.html style.css .github/workflows/portfolio-polish.yml
          git commit -m "refactor: polish portfolio content and typography" || exit 0
          git push
